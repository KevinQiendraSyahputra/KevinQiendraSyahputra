<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Terminal: whoami, stack, status">
  <title>Terminal</title>
  <rect x="4" y="4" width="1192" height="352" rx="22" fill="#0B1220" stroke="#22304A" stroke-width="2"/>
  <rect x="4" y="4" width="1192" height="50" rx="22" fill="#0E1726"/>
  <rect x="4" y="32" width="1192" height="22" fill="#0E1726"/>

  <circle cx="34" cy="28" r="6" fill="#FB7185">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="58" cy="28" r="6" fill="#FBBF24">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" begin="0.35s" repeatCount="indefinite"/>
  </circle>
  <circle cx="82" cy="28" r="6" fill="#34D399">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <text x="112" y="34" font-family="ui-monospace, 'Courier New', monospace" font-size="14" fill="#475569">~/kevin - zsh</text>

  <rect x="4" y="54" width="1192" height="3" fill="#16233A"/>
  <rect x="4" y="54" width="0" height="3" fill="#38BDF8">
    <animate attributeName="width" values="0;1192" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g font-family="ui-monospace, 'Courier New', monospace" font-size="20">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.4s" fill="freeze"/>
      <text x="64" y="110" fill="#38BDF8">$</text>
      <text x="88" y="110" fill="#94A3B8">whoami</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="1s" fill="freeze"/>
      <text x="64" y="150" fill="#FBBF24">kevin@pekanbaru</text>
      <text x="256" y="150" fill="#64748B">· web &amp; mobile developer</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.7s" fill="freeze"/>
      <text x="64" y="196" fill="#38BDF8">$</text>
      <text x="88" y="196" fill="#94A3B8">cat stack.json</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="2.4s" fill="freeze"/>
      <text x="64" y="236" fill="#64748B">{</text>
      <text x="88" y="236" fill="#FBBF24">"backend"</text>
      <text x="200" y="236" fill="#64748B">:</text>
      <text x="212" y="236" fill="#34D399">"Laravel"</text>
      <text x="324" y="236" fill="#64748B">,</text>
      <text x="336" y="236" fill="#FBBF24">"mobile"</text>
      <text x="436" y="236" fill="#64748B">:</text>
      <text x="448" y="236" fill="#34D399">"Flutter"</text>
      <text x="560" y="236" fill="#64748B">,</text>
      <text x="572" y="236" fill="#FBBF24">"runtime"</text>
      <text x="684" y="236" fill="#64748B">:</text>
      <text x="696" y="236" fill="#34D399">"Linux"</text>
      <text x="784" y="236" fill="#64748B">}</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="3.1s" fill="freeze"/>
      <text x="64" y="282" fill="#38BDF8">$</text>
      <text x="88" y="282" fill="#94A3B8">status --now</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="3.8s" fill="freeze"/>
      <text x="64" y="322" fill="#34D399">&gt;</text>
      <text x="92" y="322" fill="#94A3B8">open to freelance · internship · collaboration</text>
    </g>

    <rect x="654" y="303" width="11" height="23" fill="#38BDF8">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.55;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
